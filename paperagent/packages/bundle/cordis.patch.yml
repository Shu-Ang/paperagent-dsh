# The bundle itself owns both the Host entry and browser client manifest.
- insert:
    - id: paperagent
      name: '@paperagent/dsh-paperagent'
      config:
        databasePath: !!js dshHomePath('paperagent/domain.sqlite')
        maxPdfBytes: 209715200
        downloadTimeoutMs: 60000
        maxDownloadRedirects: 3
        mineru:
          apiBaseUrl: 'https://mineru.net'
          # Credential name resolved by DSH from DSH_HOME/.credentials.yaml.
          apiTokenEnv: 'MINERU_API_TOKEN'
          modelVersion: 'vlm'
          enableOcr: false
          enableFormula: true
          enableTable: true
          pollIntervalMs: 3000
          timeoutMs: 600000
        vision:
          enabled: false
          apiBaseUrl: 'https://api.deepseek.com'
          credentialRef: 'DEEPSEEK_API_KEY'
          model: 'deepseek-v4-flash-vision-exp'
          concurrency: 2
          timeoutMs: 45000
          maxImageBytes: 10485760
          maxRetries: 1
        embedding:
          # Provider availability is enabled here; the persisted PaperAgent
          # switch remains the user-controlled indexing/retrieval toggle.
          enabled: true
          credentialRef: 'DASHSCOPE_API_KEY'
          model: 'qwen3-vl-embedding'
          dimensions: 1024
          concurrency: 2
          timeoutMs: 30000
          maxImageBytes: 10485760
        elasticsearch:
          enabled: true
          nodeUrl: 'http://127.0.0.1:9200'
          apiKeyRef: 'PAPERAGENT_ES_API_KEY'
          timeoutMs: 5000
          indexPrefix: 'paperagent'
        reranker:
          # Keep the provider available; the per-user switch remains off until enabled in Settings.
          enabled: true
          credentialRef: 'DASHSCOPE_API_KEY'
          model: 'auto'
          endpoint: 'https://dashscope.aliyuncs.com'
          candidateLimit: 20
          topN: 6
          timeoutMs: 30000
          includeFigureImages: false
          maxImageBytes: 5242880
